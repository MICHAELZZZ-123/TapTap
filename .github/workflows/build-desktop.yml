name: Build desktop apps

# PACKAGING: PyInstaller must build on the target OS; Linux cannot emit TapTap.exe.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: TapTap-Windows-x64
            output: dist/TapTap.exe
          - name: Linux x64
            os: ubuntu-24.04
            artifact: TapTap-Linux-x64
            output: dist/TapTap

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libnss3 libxkbfile1 libxkbcommon-x11-0 libxcb-cursor0
          libxcb-icccm4 libxcb-util1 libxcb-image0 libxcb-keysyms1
          libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python scripts/build_desktop.py

      - name: Smoke-test executable startup
        run: python -c "import subprocess; subprocess.run([r'${{ matrix.output }}', '--help'], check=True)"

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
